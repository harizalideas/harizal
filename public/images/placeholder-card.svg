<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Dashed Border -->
  <rect x="20" y="20" width="360" height="360" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Card Illustration -->
  <rect x="100" y="70" width="200" height="260" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))"/>

  <!-- Card Lanyard Hole -->
  <rect x="175" y="85" width="50" height="12" rx="6" fill="#0B0F19"/>

  <!-- Camera / Gift Icon on Card -->
  <circle cx="200" cy="180" r="44" fill="url(#roseGrad)" opacity="0.9"/>
  <path d="M182 172 C182 169 184 167 187 167 L192 167 L195 163 C196 162 198 161 200 161 L200 161 C202 161 204 162 205 163 L208 167 L213 167 C216 167 218 169 218 172 L218 193 C218 196 216 198 213 198 L187 198 C184 198 182 196 182 193 Z" fill="#FFFFFF"/>
  <circle cx="200" cy="183" r="8" fill="#E11D48"/>

  <!-- Sparkles -->
  <path d="M140 125 L144 135 L154 139 L144 143 L140 153 L136 143 L126 139 L136 135 Z" fill="url(#goldGrad)"/>
  <path d="M260 220 L263 228 L271 231 L263 234 L260 242 L257 234 L249 231 L257 228 Z" fill="url(#goldGrad)"/>

  <!-- Text -->
  <text x="200" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
    Foto Kado 3D
  </text>
  <text x="200" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">
    Ketuk untuk unggah foto
  </text>
</svg>
